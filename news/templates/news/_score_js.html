<script>
/* Ubao wa matokeo: magoli na dakika mpya kila sekunde 30 bila kurefresh (news.views.live_scores) */
(function () {
  var zone = document.getElementById('lv-zone'), tried = null;
  if (!document.querySelector('[data-match]') && !zone) return;
  function swap(v) {      /* mechi mpya imeanza / imeisha: orodha inajibadilisha bila kurefresh */
    if (tried === v) return;
    tried = v;
    fetch(location.pathname, {cache: 'no-store', credentials: 'same-origin'}).then(function (r) { return r.text(); }).then(function (html) {
      var fresh = new DOMParser().parseFromString(html, 'text/html').getElementById('lv-zone');
      if (!fresh || fresh.dataset.v === zone.dataset.v) return;
      zone.innerHTML = fresh.innerHTML;
      zone.dataset.v = fresh.dataset.v;
    }).catch(function () {});
  }
  function tick() {
    if (document.hidden) return;
    fetch('{% url "news:live_scores" %}', {cache: 'no-store'}).then(function (r) { return r.json(); }).then(function (d) {
      if (zone && d.v && d.v !== zone.dataset.v) swap(d.v);
      d.matches.forEach(function (m) {
        document.querySelectorAll('[data-match="' + m.id + '"]').forEach(function (el) {
          var s = el.querySelector('[data-score]'), c = el.querySelector('[data-clock]');
          var txt = (m.hg === null || m.ag === null) ? null : m.hg + '-' + m.ag;
          if (s && txt && s.textContent.replace(/\s/g, '') !== txt) {
            s.innerHTML = m.hg + '<i>-</i>' + m.ag;
            el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
          }
          if (c && c.textContent !== m.clock) c.textContent = m.clock;
          el.classList.toggle('is-on', m.playing);
          el.classList.toggle('is-ft', m.finished);
        });
      });
    }).catch(function () {});
  }
  setInterval(tick, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
})();
</script>
