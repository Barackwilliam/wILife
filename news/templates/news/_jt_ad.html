{% load news_tags %}{% if service %}<div class="ad-card">
  <i class="bi {{ service.icon }}" style="font-size:1.8rem"></i>
  <h5>{{ service.name }}</h5>
  <p>{{ service.tagline }}</p>
  <a href="{{ service.get_absolute_url }}" class="btn btn-sm">Jifunze zaidi <i class="bi bi-arrow-right"></i></a>
</div>{% endif %}
