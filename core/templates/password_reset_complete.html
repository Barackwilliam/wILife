{% extends 'layouts/auth.html' %}
{% block title %}Password updated{% endblock %}
{% block content %}
<div class="empty px-0 pt-0 text-start align-items-start">
  <div class="art" style="background:var(--leaf-soft);color:var(--leaf)"><i class="bi bi-shield-check"></i></div>
  <span class="eyebrow">All set</span>
  <h1 class="mt-2">Password updated.</h1>
  <p>You can sign in with your new password now.</p>
  <a href="{% url 'login' %}" class="btn btn-brand btn-lg mt-2">Sign in <i class="bi bi-arrow-right"></i></a>
</div>
{% endblock %}
