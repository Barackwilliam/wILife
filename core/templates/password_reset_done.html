{% extends 'layouts/auth.html' %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="empty px-0 pt-0 text-start align-items-start">
  <div class="art"><i class="bi bi-envelope-paper-heart"></i></div>
  <span class="eyebrow">Link sent</span>
  <h1 class="mt-2">Check your inbox.</h1>
  <p>If an account exists for that email, a reset link is on its way. It can take a minute — and check spam, just in case.</p>
  <a href="{% url 'login' %}" class="btn btn-ghost mt-2"><i class="bi bi-arrow-left"></i> Back to sign in</a>
</div>
{% endblock %}
