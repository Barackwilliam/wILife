{% extends 'base.html' %}
{% block title %}Delete Goal{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4 text-center">
      <i class="bi bi-exclamation-triangle-fill text-danger display-3 mb-3"></i>
      <h4 class="fw-bold mb-2">Delete Goal?</h4>
      <p class="text-muted mb-1">You are about to delete:</p>
      <p class="fw-semibold fs-5 mb-3">{{ goal.title }}</p>
      <p class="text-danger small mb-4">
        This will also delete all progress updates and milestones. This action cannot be undone.
      </p>
      <form method="post" class="d-flex gap-2 justify-content-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-trash me-2"></i>Yes, Delete
        </button>
        <a href="{% url 'goal_detail' goal.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
